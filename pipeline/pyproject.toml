[project]
name = "ffnews"
version = "0.1.0"
description = "ESPN fantasy football data pipeline and newsletter drafting for a home league"
requires-python = ">=3.11"
dependencies = [
    "espn-api>=0.45.1",
    "anthropic>=0.69.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.scripts]
ffnews = "ffnews.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ffnews"]
